name: DevOps Practice

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./students/dennis

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: './students/dennis/src/package-lock.json'
      
    - name: Initialize Node CI
      run: npm ci
      working-directory: ./students/dennis/src

    - name: Run the app
      working-directory: ./students/dennis/src
      run: npm run build